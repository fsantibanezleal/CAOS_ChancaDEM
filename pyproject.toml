# Repo-local tool configuration ONLY. This product declares NO package: per
# conventions/no-internal-packages.md, a package means a separate repo with a valid PyPI
# project, consumed as a dependency. The data-pipeline/ folder is scripts, invoked by path.
# ChancaDEM, the offline engine package (instantiated from the CAOS product-repo archetype, ADR-0057).
# The DEFAULT pipeline is numpy-only (builds the replay layer from committed artifacts); the heavy lane (torch +
# the Node sweep of the TS engine) lives in requirements-precompute.txt and is documented in docs/frameworks/.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data-pipeline/pipeline/stages/dem.py"]  # the offline DEM tracer (WIP), linted separately

[tool.ruff.lint]
ignore = ["E741"]
