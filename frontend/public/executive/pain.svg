<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Hard ore meets a crusher with a worn liner and an old setting, so the mill gets a coarse feed and its power meter climbs">
<title>Hard ore meets a crusher with a worn liner and an old setting, so the mill gets a coarse feed and its power meter climbs</title>
<style>
/* An animated scene (shell 0.14.0): the hard ore arrives, the trucks queue, the coarse stream reaches the mill and its power meter climbs.
   The labels never move. One 8 s loop. The static drawing below is the final frame and is what prefers-reduced-motion shows. */
.t1 { animation: t1 8s ease-out infinite; }
.t2 { animation: t2 8s ease-out infinite; }
.t3 { animation: t3 8s ease-out infinite; }
.stream { animation: stream 8s ease-in-out infinite; }
.ret { animation: ret 8s ease-in-out infinite; }
.meter { animation: meter 8s ease-in-out infinite; transform-origin: 686px 165px; }
@keyframes t1 { 0%, 4% { opacity: 0; transform: translateX(-26px); } 14%, 100% { opacity: 1; transform: none; } }
@keyframes t2 { 0%, 14% { opacity: 0; transform: translateX(-26px); } 24%, 100% { opacity: 1; transform: none; } }
@keyframes t3 { 0%, 24% { opacity: 0; transform: translateX(-26px); } 34%, 100% { opacity: 1; transform: none; } }
@keyframes ret { 0%, 34% { opacity: 0; } 50%, 100% { opacity: 1; } }
@keyframes stream { 0%, 40% { opacity: 0; } 58%, 100% { opacity: 1; } }
@keyframes meter { 0%, 52% { transform: scaleX(0.4); } 82%, 100% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) {
  .t1, .t2, .t3, .stream, .ret, .meter { animation: none; opacity: 1; transform: none; }
}
</style>
